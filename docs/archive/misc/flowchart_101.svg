<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620">
  <rect width="800" height="620" fill="#fafaf9"/>
  <!-- title -->
  <text x="400" y="30" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#1f2937">101. 对称二叉树 — isMirror(p,q) 流程</text>
  <!-- legend -->
  <rect x="520" y="50" width="260" height="70" rx="8" fill="white" stroke="#e5e7eb"/>
  <text x="530" y="70" font-family="Segoe UI" font-size="11" fill="#374151">图例：</text>
  <rect x="530" y="78" width="14" height="14" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="550" y="89" font-size="11" fill="#374151">判断</text>
  <rect x="600" y="78" width="14" height="14" rx="3" fill="#dcfce7" stroke="#22c55e"/>
  <text x="620" y="89" font-size="11" fill="#374151">返回</text>
  <rect x="530" y="98" width="14" height="14" rx="7" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="550" y="109" font-size="11" fill="#374151">递归</text>

  <!-- nodes -->
  <!-- start -->
  <rect x="280" y="140" width="240" height="40" rx="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="165" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="600" fill="#92400e">isMirror(p,q) 开始</text>
  <!-- q1 -->
  <rect x="260" y="210" width="280" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="400" y="230" text-anchor="middle" font-family="Segoe UI" font-size="12" fill="#1e3a8a">p==null &amp;&amp; q==null ?</text>
  <text x="400" y="248" text-anchor="middle" font-family="Segoe UI" font-size="10" fill="#3b82f6">都空，一对镜像抵消</text>
  <!-- yes true -->
  <rect x="560" y="215" width="120" height="36" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="620" y="238" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">return true</text>
  <!-- q2 -->
  <rect x="260" y="290" width="280" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="400" y="310" text-anchor="middle" font-family="Segoe UI" font-size="12" fill="#1e3a8a">p==null || q==null ?</text>
  <text x="400" y="328" text-anchor="middle" font-family="Segoe UI" font-size="10" fill="#3b82f6">一空一有，不对称</text>
  <rect x="560" y="295" width="120" height="36" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="620" y="318" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">return false</text>
  <!-- q3 -->
  <rect x="260" y="370" width="280" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="400" y="390" text-anchor="middle" font-family="Segoe UI" font-size="12" fill="#1e3a8a">p.val != q.val ?</text>
  <text x="400" y="408" text-anchor="middle" font-family="Segoe UI" font-size="10" fill="#3b82f6">值不等，不对称</text>
  <rect x="560" y="375" width="120" height="36" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="620" y="398" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">return false</text>
  <!-- recurse -->
  <rect x="240" y="460" width="320" height="60" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="482" text-anchor="middle" font-family="Segoe UI" font-size="12" font-weight="600" fill="#92400e">值相等 → 查孩子</text>
  <text x="400" y="500" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#92400e">isMirror(p.left, q.right) &amp;&amp; isMirror(p.right, q.left)</text>
  <text x="400" y="514" text-anchor="middle" font-family="Segoe UI" font-size="9" fill="#a16207">外侧对 外侧，内侧对 内侧</text>

  <!-- arrows -->
  <line x1="400" y1="180" x2="400" y2="210" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="235" x2="560" y2="235" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="545" y="230" font-size="9" fill="#22c55e">是</text>
  <line x1="400" y1="260" x2="400" y2="290" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="410" y="280" font-size="9" fill="#ef4444">否</text>
  <line x1="540" y1="315" x2="560" y2="315" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="545" y="310" font-size="9" fill="#ef4444">是</text>
  <line x1="400" y1="340" x2="400" y2="370" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="410" y="360" font-size="9" fill="#ef4444">否</text>
  <line x1="540" y1="395" x2="560" y2="395" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="545" y="390" font-size="9" fill="#ef4444">是</text>
  <line x1="400" y1="420" x2="400" y2="460" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="410" y="445" font-size="9" fill="#22c55e">否(相等)</text>

  <defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker></defs>

  <!-- example -->
  <rect x="20" y="540" width="760" height="65" rx="8" fill="white" stroke="#e5e7eb"/>
  <text x="30" y="560" font-family="Segoe UI" font-size="10" font-weight="700" fill="#1f2937">走例 [1,2,2,3,4,4,3]：1→isMirror(2,2) 值等 → isMirror(3,3)✓ && isMirror(4,4)✓ → true</text>
  <text x="30" y="580" font-family="Segoe UI" font-size="10" fill="#6b7280">反例 [1,2,2,null,3,null,3]：isMirror(2,2) 值等 → isMirror(null,3) → 一空一有 → false</text>
  <text x="30" y="595" font-family="Segoe UI" font-size="9" fill="#9ca3af">入口：isSymmetric(root) → root==null? true : isMirror(root.left, root.right)</text>
</svg>
